name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build tag carries the run number and commit so image
      # automation can order builds numerically.
      - name: Compute the image tag
        id: tag
        run: echo "tag=main-${{ github.run_number }}-$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/chrisguidry/openmtg:${{ steps.tag.outputs.tag }}
            ghcr.io/chrisguidry/openmtg:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
